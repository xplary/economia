<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin</title>
    
    <!-- ¡IMPORTANTE! AQUÍ SE SOLUCIONA EL ERROR "Cropper is not defined" -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
</head>
<body>

    <!-- Tu HTML del panel admin va aquí -->
    <div id="admin-panel">
        <h2>Subir Destacado</h2>
        <input type="file" id="input-imagen-destacado" accept="image/*">
        <div>
            <img id="imagen-preview" style="max-width: 100%; display: none;">
        </div>
        <button id="btn-guardar-destacado">Guardar Destacado</button>
    </div>

    <!-- ¡IMPORTANTE! AQUÍ SE CARGA EL SCRIPT DE CROPPER ANTES DE admin.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <!-- Aquí cargas tu script (asegúrate que sea type="module" si usas import de Firebase) -->
    <script type="module" src="admin.js"></script>
</body>
</html>
