<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Economía</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Quill.js (Editor de texto enriquecido) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand brand-gradient m-0" href="#">ECONOMIA</a>
            
            <ul class="nav nav-underline" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link text-dark active" data-bs-toggle="pill" data-bs-target="#eventos" type="button">Noticias de Economía</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link text-dark" data-bs-toggle="pill" data-bs-target="#articulos" type="button">Trabajos y Artículos</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link text-dark" data-bs-toggle="pill" data-bs-target="#opiniones" type="button">Debates y Encuestas</button>
                </li>
            </ul>

            <div class="d-flex align-items-center">
                <button id="btn-login" class="btn btn-outline-primary btn-sm rounded-pill px-4">Ingresar</button>
                <button id="btn-logout" class="btn btn-outline-danger btn-sm rounded-pill px-4 d-none">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="tab-content" id="pills-tabContent">
            
            <!-- SECCIÓN: NOTICIAS -->
            <div class="tab-pane fade show active" id="eventos" role="tabpanel">
                <div class="admin-only d-none mb-5 p-4 bg-light rounded border border-primary">
                    <h5 class="text-primary fw-bold mb-3"><i class="bi bi-newspaper"></i> Publicar Nueva Noticia</h5>
                    <input type="text" id="noticia-titulo" class="form-control mb-2" placeholder="Titular de la noticia">
                    <input type="text" id="noticia-etiqueta" class="form-control mb-3" placeholder="Etiqueta (Ej: ECONOMÍA Y EMPRESA)">
                    <div class="bg-white mb-3">
                        <div id="editor-noticias" style="height: 200px;"></div>
                    </div>
                    <button id="btn-publicar-noticia" class="btn btn-primary px-4">Publicar Noticia</button>
                </div>
                
                <h2 class="mb-4 fw-bold text-main-color" style="letter-spacing: -0.5px;">
                    <span class="text-primary">•</span> Noticias de Economía y Desarrollo
                </h2>

                <!-- Contenedor dinámico de Noticias -->
                <div id="contenedor-noticias">
                    <!-- Skeletons (Mientras carga) -->
                    <div class="row mb-5 border-bottom pb-5 skeleton-card">
                        <div class="col-lg-7 mb-3 mb-lg-0">
                            <div class="skeleton-box rounded w-100" style="height: 350px;"></div>
                        </div>
                        <div class="col-lg-5 d-flex flex-column justify-content-center ps-lg-4">
                            <div class="skeleton-box rounded mb-3" style="width: 100px; height: 25px;"></div>
                            <div class="skeleton-box rounded mb-3" style="width: 100%; height: 40px;"></div>
                            <div class="skeleton-box rounded mb-4" style="width: 100%; height: 80px;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN: ARTÍCULOS (Estructura similar) -->
            <div class="tab-pane fade" id="articulos" role="tabpanel">
                <!-- Se puede replicar la estructura de noticias aquí más adelante -->
                <p class="text-muted text-center mt-5">Aún no hay artículos publicados.</p>
            </div>

            <!-- SECCIÓN: DEBATES Y ENCUESTAS -->
            <div class="tab-pane fade" id="opiniones" role="tabpanel">
                <div class="admin-only d-none mb-4 p-4 bg-light rounded border border-primary">
                    <h5 class="text-primary fw-bold"><i class="bi bi-bar-chart-fill"></i> Crear Encuesta / Debate</h5>
                    <input type="text" id="encuesta-pregunta" class="form-control mb-3" placeholder="Pregunta del debate o encuesta">
                    
                    <div id="opciones-encuesta">
                        <input type="text" class="form-control mb-2 opcion-input" placeholder="Opción 1">
                        <input type="text" class="form-control mb-2 opcion-input" placeholder="Opción 2">
                    </div>
                    <button id="btn-agregar-opcion" class="btn btn-sm btn-outline-secondary mb-3">+ Agregar Opción</button>
                    <br>
                    <button id="btn-publicar-encuesta" class="btn btn-primary px-4">Publicar Encuesta</button>
                </div>

                <!-- Contenedor dinámico de Encuestas -->
                <div id="contenedor-encuestas">
                    <div class="skeleton-box rounded w-100 mb-3" style="height: 150px;"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
