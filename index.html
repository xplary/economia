<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEUNP - Plataforma de Economía</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Nav -->
    <nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm py-3 mb-4 sticky-top">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand brand-gradient m-0 fs-3 fw-bold" href="#">ECONOMIA</a>
            <ul class="nav nav-underline d-none d-md-flex" id="tabs-secciones" role="tablist">
                <!-- Se generan dinámicamente en JS para ahorrar espacio -->
            </ul>
            <div>
                <button id="btn-login" class="btn btn-outline-primary rounded-pill px-4 fw-semibold">Ingresar</button>
                <button id="btn-logout" class="btn btn-outline-danger rounded-pill px-4 fw-semibold d-none">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        
        <!-- ========================================== -->
        <!-- PANEL DE ADMINISTRACIÓN GLOBAL (UNIFICADO) -->
        <!-- ========================================== -->
        <div class="admin-only d-none mb-5">
            <button class="btn btn-primary shadow-sm rounded-pill px-4 w-100" data-bs-toggle="collapse" data-bs-target="#panelAdmin">
                <i class="bi bi-magic me-2"></i> Crear Nueva Publicación Global
            </button>
            
            <div class="collapse mt-3" id="panelAdmin">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <input type="text" id="p-titulo" class="form-control form-control-lg bg-light border-0" placeholder="Título de la publicación...">
                        </div>
                        <div class="col-md-4">
                            <select id="p-seccion" class="form-select form-select-lg bg-light border-0">
                                <option value="investigacion">📄 Investigación & Papers</option>
                                <option value="ensayos">✍️ Ensayos & Debates</option>
                                <option value="columnas">💭 Columnas de Opinión</option>
                                <option value="voz">🎙️ Voz FEUNP / Entrevistas</option>
                            </select>
                        </div>
                        <div class="col-md-6 d-flex gap-2 align-items-center">
                            <input type="text" id="p-tags" class="form-control bg-light border-0" placeholder="Etiquetas (ej: Macro, Tesis, UNP)">
                            <input type="color" id="p-color" class="form-control form-control-color border-0 bg-light" value="#092e6e" title="Color de etiquetas">
                        </div>
                        <div class="col-md-6 d-flex align-items-center justify-content-between bg-light rounded-3 px-3">
                            <div class="form-check form-switch mt-1">
                                <input class="form-check-input" type="checkbox" id="p-principal">
                                <label class="form-check-label fw-bold text-primary">Destacar como Principal (Grande)</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <input type="url" id="p-drive" class="form-control bg-light border-0" placeholder="Link a PDF en Google Drive (Opcional)">
                        </div>
                        <div class="col-12 mt-3">
                            <div id="editor-global" class="bg-white border rounded" style="height: 250px;"></div>
                        </div>
                        <div class="col-12 text-end mt-3">
                            <button id="btn-publicar" class="btn btn-success px-5 rounded-pill fw-bold">Publicar Ahora</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- CONTENEDORES DE LAS 4 SECCIONES -->
        <!-- ========================================== -->
        <div class="tab-content" id="contenido-secciones">
            <!-- Se generan dinámicamente desde JS -->
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
