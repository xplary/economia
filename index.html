<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEUNP - Plataforma Académica</title>
    <!-- Bootstrap, Iconos y Fuentes Profesionales -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm py-3 mb-4 sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand brand-gradient m-0 fs-3 fw-bold" href="#">ECONOMIA</a>
            <ul class="nav nav-underline d-none d-md-flex" id="pills-tab" role="tablist">
                <li class="nav-item"><button class="nav-link text-dark active px-3 fw-semibold" data-bs-toggle="pill" data-bs-target="#columnas" type="button">Columnas de Opinión</button></li>
                <li class="nav-item"><button class="nav-link text-dark px-3 fw-semibold" data-bs-toggle="pill" data-bs-target="#investigacion" type="button">Investigación & Papers</button></li>
                <li class="nav-item"><button class="nav-link text-dark px-3 fw-semibold" data-bs-toggle="pill" data-bs-target="#ensayos" type="button">Debates</button></li>
            </ul>
            <div>
                <button id="btn-login" class="btn btn-outline-primary btn-sm rounded-pill px-4 fw-bold shadow-sm">Ingresar</button>
                <button id="btn-logout" class="btn btn-outline-danger btn-sm rounded-pill px-4 fw-bold shadow-sm d-none">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="tab-content" id="pills-tabContent">
            
            <!-- ========================================== -->
            <!-- 1. COLUMNAS DE OPINIÓN -->
            <!-- ========================================== -->
            <div class="tab-pane fade show active" id="columnas" role="tabpanel">
                
                <!-- Admin UI -->
                <div class="admin-only d-none mb-4">
                    <button class="btn btn-primary rounded-pill shadow-sm px-4 fw-bold mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#colNoticia"><i class="bi bi-pencil-square me-2"></i> Redactar Columna</button>
                    <div class="collapse" id="colNoticia">
                        <div class="card border-0 shadow rounded-4 p-4 mb-4 bg-white">
                            <h5 class="fw-bold text-primary mb-3" id="not-form-title">Editor de Columnas</h5>
                            <div class="row g-3 mb-3">
                                <div class="col-md-12"><input type="text" id="not-titulo" class="form-control form-control-lg bg-light border-0" placeholder="Titular de la columna"></div>
                                <div class="col-md-5">
                                    <label class="small fw-bold text-muted mb-1">Subir Imagen (Opcional):</label>
                                    <input type="file" id="not-imagen" class="form-control bg-light border-0" accept="image/*">
                                </div>
                                <div class="col-md-5">
                                    <label class="small fw-bold text-muted mb-1">Etiquetas (Separar por comas):</label>
                                    <input type="text" id="not-tags" class="form-control bg-light border-0" placeholder="Ej: UNP, Política">
                                </div>
                                <div class="col-md-2">
                                    <label class="small fw-bold text-muted mb-1">Color Tag:</label>
                                    <input type="color" id="not-color" class="form-control form-control-color border-0 p-1 bg-light w-100" value="#1976d2">
                                </div>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="not-principal">
                                <label class="form-check-label fw-bold text-primary small">Marcar como Noticia Principal (Tamaño Grande)</label>
                            </div>
                            <div class="border rounded-3 bg-white overflow-hidden mb-3"><div id="editor-noticias" style="height: 180px;"></div></div>
                            <div class="text-end">
                                <button class="btn btn-light rounded-pill px-4 me-2 fw-bold" onclick="cancelarEdicion()">Cancelar</button>
                                <button id="btn-pub-noticia" class="btn btn-success px-5 rounded-pill fw-bold">Publicar Columna</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- CONTENEDOR: Noticia Principal (Grande) -->
                <div id="contenedor-noticia-principal"></div>

                <!-- Buscador y Filtro Funcional -->
                <div class="row mb-4 mt-2">
                    <div class="col-md-8">
                        <div class="d-flex gap-2">
                            <div class="input-group shadow-sm rounded-3 overflow-hidden">
                                <span class="input-group-text bg-white border-0 text-muted"><i class="bi bi-search"></i></span>
                                <input type="text" id="input-buscar" class="form-control border-0 py-2" placeholder="Buscar por título o contenido...">
                            </div>
                            <button id="btn-ordenar" class="btn btn-white border shadow-sm px-3 text-nowrap fw-semibold">Ordenar por: Recientes ↓</button>
                        </div>
                    </div>
                </div>

                <!-- Lista y Sidebar -->
                <div class="row">
                    <div class="col-lg-8" id="contenedor-noticias-lista">
                        <div class="skeleton-box rounded w-100 mb-3" style="height: 200px;"></div>
                    </div>
                    
                    <!-- Sidebar Editable -->
                    <div class="col-lg-4 ps-lg-4 mt-4 mt-lg-0">
                        <div class="p-4 bg-white shadow-sm position-relative" style="border: 2px solid #dc3545;">
                            <button class="btn btn-sm btn-warning position-absolute top-0 end-0 m-2 admin-only-inline shadow-sm" onclick="editarSidebar()" title="Editar Panel"><i class="bi bi-pencil-fill"></i></button>
                            
                            <h4 id="sb-titulo" class="fw-bold mb-4 font-serif" style="color: #1a202c; font-size: 1.4rem; line-height: 1.4;">Te damos la bienvenida a nuestro nuevo INTEGRATE</h4>
                            <div class="d-flex mb-3 align-items-start">
                                <div class="bg-primary text-white text-center p-2 rounded-2 me-3 shadow-sm" style="min-width: 60px;">
                                    <small class="d-block text-uppercase" style="font-size: 0.55rem; letter-spacing: 0.5px;">HASTA</small>
                                    <span id="sb-dia" class="fs-4 fw-bold lh-1 d-block my-1">15</span>
                                    <small id="sb-mes" class="d-block text-uppercase" style="font-size: 0.65rem;">OCT</small>
                                </div>
                                <div>
                                    <p id="sb-desc" class="mb-0 fw-bold font-inter" style="font-size: 0.9rem; color: #2d3748;">Conferencia Internacional: Empleabilidad, IA y competencias...</p>
                                </div>
                            </div>
                            <a href="#" class="text-dark text-decoration-none fw-bold mt-2 d-inline-block font-inter" style="font-size: 0.95rem;">Ver mas... <i class="bi bi-arrow-right-circle ms-1 text-muted"></i></a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- 2. INVESTIGACIÓN & PAPERS -->
            <!-- ========================================== -->
            <div class="tab-pane fade" id="investigacion" role="tabpanel">
                <div class="admin-only d-none mb-4">
                    <button class="btn btn-primary rounded-pill shadow-sm px-4 fw-bold mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#colArticulo"><i class="bi bi-cloud-arrow-up me-2"></i> Subir Paper</button>
                    <div class="collapse" id="colArticulo">
                        <div class="card border-0 shadow rounded-4 p-4 mb-4 bg-white">
                            <h5 class="fw-bold text-primary mb-3">Subir Investigación</h5>
                            <div class="row g-3">
                                <div class="col-md-6"><input type="text" id="art-titulo" class="form-control bg-light border-0" placeholder="Título completo"></div>
                                <div class="col-md-6"><input type="url" id="art-link" class="form-control bg-light border-0" placeholder="Enlace del PDF (Drive)"></div>
                                <div class="col-md-9"><input type="text" id="art-tags" class="form-control bg-light border-0" placeholder="Etiquetas (Ej: Tesis, Macroeconomía)"></div>
                                <div class="col-md-3"><input type="color" id="art-color" class="form-control form-control-color border-0 p-1 bg-light w-100" value="#dc3545"></div>
                                <div class="col-12"><textarea id="art-resumen" class="form-control bg-light border-0" rows="3" placeholder="Resumen o Abstract..."></textarea></div>
                                <div class="col-12 text-end">
                                    <button class="btn btn-light rounded-pill px-4 me-2 fw-bold" onclick="cancelarEdicion()">Cancelar</button>
                                    <button id="btn-pub-articulo" class="btn btn-success px-5 rounded-pill fw-bold">Publicar Paper</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row" id="contenedor-articulos"></div>
            </div>

            <!-- ========================================== -->
            <!-- 3. DEBATES -->
            <!-- ========================================== -->
            <div class="tab-pane fade" id="ensayos" role="tabpanel">
                <div class="admin-only d-none mb-4">
                    <button class="btn btn-primary rounded-pill shadow-sm px-4 fw-bold mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#colEncuesta"><i class="bi bi-bar-chart-steps me-2"></i> Crear Debate</button>
                    <div class="collapse" id="colEncuesta">
                        <div class="card border-0 shadow rounded-4 p-4 mb-4 bg-white">
                            <h5 class="fw-bold text-primary mb-3">Generador de Debates</h5>
                            <input type="text" id="enc-pregunta" class="form-control form-control-lg bg-light border-0 mb-3" placeholder="Pregunta central del debate">
                            <div id="opciones-encuesta" class="mb-3">
                                <input type="text" class="form-control bg-light border-0 mb-2 opcion-input" placeholder="Opción 1">
                                <input type="text" class="form-control bg-light border-0 mb-2 opcion-input" placeholder="Opción 2">
                            </div>
                            <div class="d-flex justify-content-between">
                                <button id="btn-add-opcion" class="btn btn-light border fw-bold text-secondary rounded-pill px-4">+ Añadir Opción</button>
                                <div>
                                    <button class="btn btn-light rounded-pill px-4 me-2 fw-bold" onclick="cancelarEdicion()">Cancelar</button>
                                    <button id="btn-pub-encuesta" class="btn btn-success px-5 rounded-pill fw-bold">Activar Debate</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row"><div class="col-md-8 mx-auto" id="contenedor-encuestas"></div></div>
            </div>

        </div>
    </div>

    <!-- MODAL LECTURA COMPLETA -->
    <div class="modal fade" id="modalLectura" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 pb-0"><button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button></div>
                <div class="modal-body px-4 px-md-5 pb-5 pt-2">
                    <div id="modal-tags" class="mb-3"></div>
                    <h1 id="modal-titulo" class="fw-bold mb-3 font-serif" style="color: #1a202c; font-size: 2.5rem; line-height: 1.2;"></h1>
                    <div class="text-muted small mb-4 border-bottom pb-3 d-flex justify-content-between align-items-center">
                        <span id="modal-fecha" class="fw-semibold"><i class="bi bi-calendar3 me-2"></i></span>
                        <div id="modal-btn-drive"></div>
                    </div>
                    <img id="modal-imagen" src="" class="img-fluid w-100 rounded-4 mb-4 shadow-sm object-fit-cover" style="max-height: 500px; display: none;">
                    <div id="modal-contenido" class="font-inter text-secondary" style="font-size: 1.15rem; line-height: 1.8;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
